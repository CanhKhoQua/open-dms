services:
  db:
    image: postgres:16
    container_name: open-dms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: opendms
      POSTGRES_PASSWORD: opendms
      POSTGRES_DB: opendms
    ports:
      - "5432:5432"
    volumes:
      - opendms_pgdata:/var/lib/postgresql/data

volumes:
  opendms_pgdata:
